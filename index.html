<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Unity WebGL Player | Juicy Fruit Drop Merge</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="600" height="960" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Juicy Fruit Drop Merge</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var footer = document.querySelector("#unity-footer");

      function detectMobile() {
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) return true;
        if (navigator.maxTouchPoints > 1 && Math.min(window.innerWidth, window.innerHeight) < 700) return true;
        return false;
      }

      var isMobile = detectMobile();

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function viewportSize() {
        var vv = window.visualViewport;
        if (vv && vv.width && vv.height) {
          return { w: Math.floor(vv.width), h: Math.floor(vv.height) };
        }
        return { w: window.innerWidth, h: window.innerHeight };
      }

      // Stretch canvas to the exact visible viewport:
      // full screen, no black bars, no CSS cropping of UI edges.
      function fitCanvasToViewport() {
        isMobile = detectMobile();
        if (isMobile) {
          container.className = "unity-mobile";
          canvas.className = "unity-mobile";
        } else {
          container.className = "unity-desktop";
          canvas.className = "";
        }

        var vp = viewportSize();
        var footerH = (!isMobile && footer) ? Math.max(footer.offsetHeight, 38) : 0;
        // Respect iOS/Android notches when available
        var cs = window.getComputedStyle(document.documentElement);
        var insetL = isMobile ? (parseFloat(cs.getPropertyValue("--sat-left")) || 0) : 0;
        var insetR = isMobile ? (parseFloat(cs.getPropertyValue("--sat-right")) || 0) : 0;
        var insetT = isMobile ? (parseFloat(cs.getPropertyValue("--sat-top")) || 0) : 0;
        var insetB = isMobile ? (parseFloat(cs.getPropertyValue("--sat-bottom")) || 0) : 0;

        var maxW = Math.max(1, Math.floor(vp.w - insetL - insetR));
        var maxH = Math.max(100, Math.floor(vp.h - footerH - insetT - insetB));

        canvas.style.width = maxW + "px";
        canvas.style.height = maxH + "px";
        container.style.left = "";
        container.style.top = "";
        container.style.transform = "";
        container.style.width = maxW + "px";
        container.style.height = (maxH + (!isMobile ? footerH : 0)) + "px";
        container.style.overflow = "hidden";
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Webgl.loader.js";
      var config = {
        dataUrl: buildUrl + "/Webgl.data",
        frameworkUrl: buildUrl + "/Webgl.framework.js",
        codeUrl: buildUrl + "/Webgl.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Juicy Fruit Drop Merge",
        productVersion: "1.0.5",
        showBanner: unityShowBanner,
      };

      if (isMobile) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      fitCanvasToViewport();
      window.addEventListener("resize", fitCanvasToViewport);
      window.addEventListener("orientationchange", function () {
        setTimeout(fitCanvasToViewport, 150);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fitCanvasToViewport);
        window.visualViewport.addEventListener("scroll", fitCanvasToViewport);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fitCanvasToViewport();
          setTimeout(fitCanvasToViewport, 50);
          setTimeout(fitCanvasToViewport, 300);
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
