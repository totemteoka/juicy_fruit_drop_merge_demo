<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | Juicy Fruit Drop Merge</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=600 height=960 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Juicy Fruit Drop Merge</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var footer = document.querySelector("#unity-footer");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Keep 9:16 canvas fully visible (no top/bottom crop) inside the browser window.
      function fitCanvasToViewport() {
        var designW = 600;
        var designH = 960;
        // Reserve footer space even if offsetHeight is 0 before layout
        var footerH = footer ? Math.max(footer.offsetHeight, 40) : 0;
        var maxW = window.innerWidth;
        var maxH = Math.max(100, window.innerHeight - footerH);
        var scale = Math.min(maxW / designW, maxH / designH);
        var w = Math.floor(designW * scale);
        var h = Math.floor(designH * scale);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";

        // Avoid CSS centering clipping the top when container is tall
        var totalH = h + (footer ? footer.offsetHeight : 0);
        if (totalH >= window.innerHeight - 1) {
          container.style.top = "0";
          container.style.transform = "translate(-50%, 0)";
        } else {
          container.style.top = "50%";
          container.style.transform = "translate(-50%, -50%)";
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Webgl.loader.js";
      var config = {
        dataUrl: buildUrl + "/Webgl.data",
        frameworkUrl: buildUrl + "/Webgl.framework.js",
        codeUrl: buildUrl + "/Webgl.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Juicy Fruit Drop Merge",
        productVersion: "1.0.5",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      fitCanvasToViewport();
      window.addEventListener("resize", fitCanvasToViewport);

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fitCanvasToViewport();
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
